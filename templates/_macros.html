{% macro camposNuevos(field, class="") %}
<h2 class="font-bold text-gray-800">{{ field.label }}</h2>
<dd>{{ field(class=class) }}</dd>

{% if field.errors %}
<ul>
    {% for error in field.errors %}
    <li class="text-red-600 text-sm">{{ error }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endmacro %}

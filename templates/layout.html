<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzería</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='dist/output.css') }}"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-900">
    <nav class="bg-slate-800 border-b border-slate-700 shadow-md">
      <div
        class="max-w-7xl flex flex-wrap items-center justify-between mx-auto p-4"
      >
        <a
          href="{{ url_for('pizzas.index') }}"
          class="flex items-center space-x-3"
        >
          <span
            class="self-center text-2xl font-bold whitespace-nowrap text-white"
          >
            Pizzería
          </span>
        </a>

        <div class="hidden w-full md:block md:w-auto">
          <ul
            class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-slate-600 rounded-lg bg-slate-700 md:flex-row md:space-x-8 md:mt-0 md:border-0 md:bg-slate-800"
          >
            <li>
              <a
                href="{{ url_for('pizzas.index') }}"
                class="block py-2 px-3 text-white bg-orange-600 rounded md:bg-transparent md:text-orange-400 md:p-0"
              >
                Inicio
              </a>
            </li>
            <li>
              <a href="{{ url_for('pizzas.historial') }}" class="block py-2 px-3 text-white bg-orange-600 rounded md:bg-transparent md:text-orange-400 md:p-0"> Historial </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
      {% with messages = get_flashed_messages() %} {% if messages %}
      <div class="fixed top-6 right-6 z-50 space-y-2">
        {% for message in messages %}
        <div
          class="bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded-lg shadow-lg"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %} {% block container %} {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
  </body>
</html>
